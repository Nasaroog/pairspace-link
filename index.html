<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>PairSpace</title>
  <style>
    :root { color-scheme: dark light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f0d24; color: #f3f1ff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 26rem; padding: 2rem 1.5rem; text-align: center; }
    h1 { margin: 0 0 .75rem; font-size: 1.6rem; letter-spacing: -.01em; }
    p { margin: .6rem 0; line-height: 1.5; color: #c9c6ec; }
    a, button { display: inline-block; margin-top: .6rem; padding: .65rem 1.2rem; border: 0; border-radius: 999px;
      background: #a6b1ff; color: #141230; font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
    [hidden] { display: none !important; }
    @media (prefers-color-scheme: light) {
      body { background: #f4f2ff; color: #1b1840; }
      p { color: #4b4783; }
      a, button { background: #5a62d8; color: #fff; }
    }
  </style>
</head>
<body>
  <main>
    <h1>PairSpace</h1>
    <p id="msg">Шукаємо сервер…</p>
    <a id="open" hidden>Відкрити вручну</a>
    <button id="retry" type="button" hidden>Спробувати ще раз</button>
  </main>
  <script>
    (function () {
      var msg = document.getElementById('msg');
      var open = document.getElementById('open');
      var retry = document.getElementById('retry');

      function show(text, canRetry) {
        msg.textContent = text;
        retry.hidden = !canRetry;
      }

      // This static page (github.io) is itself served through a CDN that caches for ~10 minutes and
      // ignores cache-busting query strings, so it cannot be the source of truth for an address that
      // can change every restart. The GitHub API's file-contents endpoint caches for only ~60s and
      // allows cross-origin reads; the same-origin copy is a fallback if the API is unreachable.
      var API_URL = 'https://api.github.com/repos/Nasaroog/pairspace-link/contents/current.json?ref=main';
      var FALLBACK_URL = './current.json?t=' + Date.now();
      var TIMEOUT_MS = 6000;

      // A slow/flaky connection must never leave the page stuck on "Шукаємо сервер…" forever with no
      // way out: every fetch gets its own timeout, and `gen` drops any response from a stale, already-
      // superseded attempt (e.g. the user hit "retry" again before the first one finished).
      var gen = 0;

      function fetchWithTimeout(url, options) {
        options = options || {};
        if (typeof AbortController === 'function') {
          var controller = new AbortController();
          var timer = setTimeout(function () { controller.abort(); }, TIMEOUT_MS);
          options.signal = controller.signal;
          return fetch(url, options).finally(function () { clearTimeout(timer); });
        }
        // Very old browsers without AbortController: race the fetch against a timeout instead.
        return Promise.race([
          fetch(url, options),
          new Promise(function (_, reject) { setTimeout(function () { reject(new Error('timeout')); }, TIMEOUT_MS); })
        ]);
      }

      function apply(myGen, data) {
        if (myGen !== gen) return;
        var valid = data && data.online === true && typeof data.url === 'string' &&
          /^https:\/\/[a-z0-9-]+\.(trycloudflare|onrender)\.com$/.test(data.url);
        if (!valid) {
          show('Сервер зараз вимкнений. Коли його увімкнуть, ця сама адреса знову запрацює.', true);
          return;
        }
        var target = data.url + '/' + location.hash;
        open.href = target;
        open.hidden = false;
        location.replace(target);
      }

      function fail(myGen) {
        if (myGen !== gen) return;
        show('Не вдалося дізнатися адресу сервера. Перевірте інтернет і спробуйте ще раз.', true);
      }

      function go() {
        gen += 1;
        var myGen = gen;
        show('Шукаємо сервер…', false);
        fetchWithTimeout(API_URL, { headers: { Accept: 'application/vnd.github.raw+json' } })
          .then(function (response) {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.json();
          })
          .then(function (data) { apply(myGen, data); })
          .catch(function () {
            if (myGen !== gen) return;
            // Rate-limited, timed out or offline: fall back to the (possibly a few minutes stale) same-origin copy.
            fetchWithTimeout(FALLBACK_URL, { cache: 'no-store' })
              .then(function (response) {
                if (!response.ok) throw new Error('HTTP ' + response.status);
                return response.json();
              })
              .then(function (data) { apply(myGen, data); })
              .catch(function () { fail(myGen); });
          });
      }

      retry.addEventListener('click', go);
      go();
    })();
  </script>
</body>
</html>
